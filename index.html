<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e9eee6"><link rel="manifest" href="manifest.json"><title>The Study Atelier</title><style>
:root{--bg:#f5f5ef;--card:#fffefa;--ink:#28372f;--muted:#78847b;--sage:#dce7dc;--line:#e5e8df}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui}header,main{max-width:900px;margin:auto;padding:20px}h1,h2{font-family:Georgia,serif;font-weight:500}h1{margin:0}nav{display:flex;overflow:auto;gap:7px;padding:0 15px 12px;max-width:900px;margin:auto}button{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:9px 13px;color:var(--ink)}button.active{background:var(--sage)}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 13px}.muted,small{color:var(--muted)}.task{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}input,textarea,select{padding:10px;border:1px solid var(--line);border-radius:9px;font:inherit;max-width:100%}textarea{width:100%;min-height:90px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px}.tile{background:#f0f3ec;border-radius:12px;padding:12px}.challenge{background:#f0f3ec;padding:12px;border-radius:12px;margin:8px 0}
</style></head><body><header><h1>The Study Atelier</h1><small>JEE × NID × Student life · progress with balance</small></header><nav id="nav"></nav><main id="app"></main><script>
const pages=['Home','Daily tasks','Timetable','JEE practice','NID studio','Backlogs','Lifestyle','Art journal','Progress'];let s=JSON.parse(localStorage.getItem('atelier2')||'{}');Object.assign(s,{tasks:s.tasks||["Revise class notes","Solve JEE questions","Review one backlog","NID drawing practice","Plan tomorrow"],done:s.done||{},backlogs:s.backlogs||[],water:s.water||0,meals:s.meals||{},sessions:s.sessions||0});let page='Home',app=document.querySelector('#app'),nav=document.querySelector('#nav');const save=()=>localStorage.setItem('atelier2',JSON.stringify(s));function el(t,a={},v=''){let x=document.createElement(t);Object.entries(a).forEach(([k,z])=>x.setAttribute(k,z));if(v)x.textContent=v;return x}function panel(t){let x=el('section',{class:'panel'});x.append(el('h2',{},t));app.append(x);return x}function btn(p,t,f){let b=el('button',{},t);b.onclick=f;p.append(b)}function render(){nav.innerHTML='';pages.forEach(t=>{let b=el('button',{class:t===page?'active':''},t);b.onclick=()=>{page=t;render()};nav.append(b)});app.innerHTML='';
if(page==='Home'){let p=panel('A calmer kind of productive');p.append(el('p',{class:'muted'},'Make room for study, creativity, rest and everyday care.'));let g=el('div',{class:'grid'});[['Tasks completed',Object.values(s.done).filter(Boolean).length],['Backlogs',s.backlogs.length],['Study sessions',s.sessions],['Water check-ins',s.water]].forEach(([a,b])=>{let d=el('div',{class:'tile'});d.append(el('b',{},b),el('p',{},a));g.append(d)});p.append(g)}
if(page==='Daily tasks'){let p=panel('Daily checklist');s.tasks.forEach((t,i)=>{let l=el('label',{class:'task'}),c=el('input',{type:'checkbox'});c.checked=!!s.done[i];c.onchange=()=>{s.done[i]=c.checked;save()};l.append(c,el('span',{},t));p.append(l)});let i=el('input',{placeholder:'Add a task'});p.append(i);btn(p,'＋ Add task',()=>{if(i.value.trim()){s.tasks.push(i.value.trim());save();render()}})}
if(page==='Timetable'){let p=panel('Sample coaching-day rhythm');[['8–5','Coaching'],['5–6','Rest and snack'],['6–7:30','JEE revision'],['7:30–8','Break'],['8–8:30','NID practice'],['After 8:30','Dinner and wind down']].forEach(([a,b])=>p.append(el('p',{class:'task'},a+' · '+b)))}
if(page==='JEE practice'){let p=panel('Physics quick practice');p.append(el('p',{},'A body starts from rest and accelerates at 2 m/s² for 5 s. Final speed?'));['5 m/s','10 m/s','2.5 m/s','20 m/s'].forEach((v,i)=>btn(p,v,()=>alert(i===1?'Correct: v = u + at = 10 m/s':'Try v = u + at.')));btn(p,'＋ Log study session',()=>{s.sessions++;save();render()})}
if(page==='NID studio'){let p=panel('Drawing challenges');['Redesign a water bottle for younger students','Draw a market using five shapes','Create three icons for a study app','Design a chair for a tiny reading corner','Sketch one object from three viewpoints','Make a water-saving poster','Invent gift packaging'].forEach(t=>p.append(el('div',{class:'challenge'},t)))}
if(page==='Backlogs'){let p=panel('Backlog tracker');s.backlogs.forEach((t,i)=>{let r=el('div',{class:'task'},t);btn(r,'Remove',()=>{s.backlogs.splice(i,1);save();render()});p.append(r)});let i=el('input',{placeholder:'Topic to revisit'});p.append(i);btn(p,'＋ Add backlog',()=>{if(i.value.trim()){s.backlogs.push(i.value.trim());save();render()}})}
if(page==='Lifestyle'){let p=panel('Daily lifestyle record');p.append(el('p',{class:'muted'},'Optional check-ins, not targets or scores.'));[['Sleep time','sleep','time'],['Wake-up time','wake','time'],['Approx. screen time','screen','text'],['Movement / stretch note','movement','text']].forEach(([l,k,t])=>{p.append(el('label',{},l));let i=el('input',{type:t,placeholder:l});i.value=s[k]||'';i.onchange=()=>{s[k]=i.value;save()};p.append(i)});let w=panel('Hydration check-ins');w.append(el('p',{},'Water glasses recorded: '+s.water));btn(w,'＋ Add a glass',()=>{s.water++;save();render()});btn(w,'Reset counter',()=>{s.water=0;save();render()});let m=panel('Meal check-ins');['Breakfast','Lunch','Evening snack','Dinner'].forEach(k=>{let l=el('label',{class:'task'}),c=el('input',{type:'checkbox'});c.checked=!!s.meals[k];c.onchange=()=>{s.meals[k]=c.checked;save()};l.append(c,el('span',{},k));m.append(l)});let q=panel('Mood and personal note'),sel=el('select');['Choose mood','Calm','Good','Okay','Stressed','Low energy'].forEach(x=>sel.append(el('option',{},x)));sel.value=s.mood||'Choose mood';sel.onchange=()=>{s.mood=sel.value;save()};q.append(sel);let ta=el('textarea',{placeholder:'Anything you want to remember about today?'});ta.value=s.lifeNote||'';ta.onchange=()=>{s.lifeNote=ta.value;save()};q.append(ta)}
if(page==='Art journal'){let p=panel('Creative log'),t=el('textarea',{placeholder:'What did you draw, make or notice today?'});t.value=s.art||'';t.onchange=()=>{s.art=t.value;save()};p.append(t);btn(p,'Save entry',()=>{save();alert('Saved on this device.')})}
if(page==='Progress'){let p=panel('Progress and backup');p.append(el('p',{},'Completed tasks: '+Object.values(s.done).filter(Boolean).length+' · Backlogs: '+s.backlogs.length+' · Study sessions: '+s.sessions));btn(p,'Export my records',()=>{let a=el('a',{href:URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'})),download:'study-atelier-backup.json'});a.click()})}}
render();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script></main></body></html>
